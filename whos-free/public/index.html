<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who's Free</title>
<link rel="stylesheet" href="/app.css">
<meta name="theme-color" content="#2e323f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#dcecdc" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<!-- Exactly ONE live region for the whole app, outside the grid. More than one
     produces overlapping announcements. -->
<p id="live" role="status" aria-live="polite" class="sr"></p>

<!-- The no-session screen. The server cannot know which group to show without a
     cookie, and this path is served straight off the static asset layer so the
     Worker is never invoked for it. The first /api/state returns 401 and this
     panel is what the reader sees - no guessing a slug, no 500. -->
<div class="device">
  <main id="noSession" class="pad" hidden>
    <h1>Open your invite link 🌱</h1>
    <p class="lede">This app works from the link in your group chat. Ask whoever set it up to send it again.</p>
  </main>

  <div id="app" hidden></div>
</div>

<noscript>
  <main class="pad">
    <h1>Who's Free 🌱</h1>
    <p>This needs JavaScript to show the calendar. Sorry!</p>
  </main>
</noscript>

<script type="module" src="/app.js"></script>
</body>
</html>
